<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Schedule — SkyWay Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="schedule">

  <div id="siteNav"></div>

  <header class="hero">
    <h1>Weekly Flight Schedule</h1>
    <p>Browse every flight in our network. Filter by route or day to find what you need.</p>
  </header>

  <main class="container py-4">
    <section class="card section-card mb-4">
      <div class="card-body">
        <form id="schedFilterForm" class="row g-3">
          <div class="col-md-4">
            <label for="schedSource" class="form-label">From</label>
            <input type="text" id="schedSource" class="form-control" placeholder="Origin city" />
          </div>
          <div class="col-md-4">
            <label for="schedDest" class="form-label">To</label>
            <input type="text" id="schedDest" class="form-control" placeholder="Destination city" />
          </div>
          <div class="col-md-4">
            <label for="schedDay" class="form-label">Day of Week</label>
            <select id="schedDay" class="form-select">
              <option value="">Any day</option>
              <option>Mon</option><option>Tue</option><option>Wed</option>
              <option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
            </select>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Apply Filters</button>
            <button type="button" id="schedClearBtn" class="btn btn-outline-secondary">Clear</button>
          </div>
        </form>
      </div>
    </section>

    <div class="row g-3" id="scheduleCards"></div>
  </main>

  <footer class="text-center text-muted py-4 small">© SkyWay Airlines </footer>

  <div id="siteModals"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
