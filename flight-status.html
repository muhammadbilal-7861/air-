<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Status — SkyWay Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="status">

  <div id="siteNav"></div>

  <header class="hero">
    <h1>Flight Status</h1>
    <p>Real-time updates on departures, arrivals, and delays.</p>
  </header>

  <main class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-lg-6">
        <div class="card section-card h-100"><div class="card-body">
          <h5 class="text-primary"><i class="bi bi-hash"></i> Search by Flight Number</h5>
          <form id="statusByNumberForm">
            <div class="input-group">
              <span class="input-group-text">SW</span>
              <input type="text" id="statusFlightNum" class="form-control" placeholder="e.g. 101" />
              <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Search</button>
            </div>
          </form>
        </div></div>
      </div>
      <div class="col-lg-6">
        <div class="card section-card h-100"><div class="card-body">
          <h5 class="text-primary"><i class="bi bi-geo"></i> Search by Route</h5>
          <form id="statusByRouteForm">
            <div class="input-group">
              <input type="text" id="statusSource" class="form-control" placeholder="From" />
              <span class="input-group-text"><i class="bi bi-arrow-right"></i></span>
              <input type="text" id="statusDest" class="form-control" placeholder="To" />
              <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </div>
          </form>
        </div></div>
      </div>
    </div>

    <div id="statusResults"></div>
  </main>

  <footer class="text-center text-muted py-4 small">© SkyWay Airlines · Powered by Javeria</footer>

  <div id="siteModals"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
