<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Booking — SkyWay Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="manage">

  <div id="siteNav"></div>

  <header class="hero">
    <h1>Manage Your Booking</h1>
    <p>Look up your reservation by PNR to update details or cancel.</p>
  </header>

  <main class="container py-4">
    <section class="card section-card mb-4">
      <div class="card-body">
        <form id="mbLookupForm">
          <label for="mbPnr" class="form-label">Enter your PNR</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-tag"></i></span>
            <input type="text" id="mbPnr" class="form-control text-uppercase" maxlength="6" placeholder="ABC123" required>
            <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Find Booking</button>
          </div>
          <div class="form-text">Your 6-character PNR was shown when you completed your booking.</div>
        </form>
      </div>
    </section>

    <div id="mbResult"></div>
  </main>

  <footer class="text-center text-muted py-4 small">© SkyWay Airlines. </footer>

  <div id="siteModals"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
