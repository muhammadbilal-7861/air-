<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offers & Discounts — SkyWay Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="offers">

  <div id="siteNav"></div>

  <header class="hero">
    <h1>Offers & Loyalty</h1>
    <p>Promo codes, seasonal deals, and your loyalty rewards in one place.</p>
  </header>

  <main class="container py-4">

    <section id="loyaltyBlock" class="card section-card mb-4 d-none">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <h5 class="text-primary mb-0"><i class="bi bi-stars"></i> Your Loyalty Status</h5>
            <small class="text-muted">Earn 100 points every time you book.</small>
          </div>
          <div class="text-end">
            <div><strong id="loyaltyPoints">0</strong> points</div>
            <span class="badge bg-warning text-dark">Tier: <span id="loyaltyTier">Bronze</span></span>
          </div>
        </div>
        <div class="progress" style="height: 24px;">
          <div id="loyaltyBar" class="progress-bar bg-primary" role="progressbar" style="width: 0%">0 / 500</div>
        </div>
      </div>
    </section>

    <h3 class="text-primary mb-3">Current Offers</h3>
    <div class="row g-3" id="offersGrid"></div>
  </main>

  <footer class="text-center text-muted py-4 small">© SkyWay Airlines · Powered by Javeria</footer>

  <div id="siteModals"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
