<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — SkyWay Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="user">

  <div id="siteNav"></div>

  <header class="hero">
    <h1>My Account</h1>
    <p>Manage your profile, view bookings, and save your favorite flights.</p>
  </header>

  <main class="container py-4">

    <!-- GUEST VIEW: login + register -->
    <div id="udGuest" class="row g-4">
      <div class="col-lg-6">
        <div class="card section-card h-100"><div class="card-body">
          <h4 class="text-primary mb-3"><i class="bi bi-box-arrow-in-right"></i> Sign In</h4>
          <form id="udLoginForm">
            <div class="mb-3">
              <label for="udLoginEmail" class="form-label">Email</label>
              <input type="email" id="udLoginEmail" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="udLoginPass" class="form-label">Password</label>
              <input type="password" id="udLoginPass" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
          </form>
        </div></div>
      </div>
      <div class="col-lg-6">
        <div class="card section-card h-100"><div class="card-body">
          <h4 class="text-primary mb-3"><i class="bi bi-person-plus"></i> Create Account</h4>
          <form id="udRegisterForm">
            <div class="mb-3">
              <label for="udRegName" class="form-label">Full Name</label>
              <input type="text" id="udRegName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="udRegEmail" class="form-label">Email</label>
              <input type="email" id="udRegEmail" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label for="udRegPass" class="form-label">Password (min 6 chars)</label>
              <input type="password" id="udRegPass" class="form-control" minlength="6" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-accent w-100">Register</button>
          </form>
        </div></div>
      </div>
    </div>

    <!-- LOGGED-IN VIEW -->
    <div id="udAuthed" class="d-none">
      <div class="alert alert-success">
        <i class="bi bi-check-circle"></i> Welcome, <strong id="udGreeting"></strong>!
      </div>

      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#udProfileTab">Profile</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#udBookingsTab">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#udFavTab">Favorites</a></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="udProfileTab">
          <div class="card section-card"><div class="card-body">
            <h5 class="text-primary mb-3">Profile Details</h5>
            <form id="udProfileForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" id="udName" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="udEmail" class="form-control" disabled>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="tel" id="udPhone" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Loyalty Points</label>
                <input type="text" id="udPoints" class="form-control" disabled value="0">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Profile</button>
              </div>
            </form>
          </div></div>
        </div>

        <div class="tab-pane fade" id="udBookingsTab">
          <div class="card section-card"><div class="card-body">
            <h5 class="text-primary mb-3">My Bookings</h5>
            <div id="udBookings"></div>
          </div></div>
        </div>

        <div class="tab-pane fade" id="udFavTab">
          <div class="card section-card"><div class="card-body">
            <h5 class="text-primary mb-3">Favorite Flights</h5>
            <div id="udFavorites"></div>
          </div></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-4 small">© SkyWay Airlines </footer>

  <div id="siteModals"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
